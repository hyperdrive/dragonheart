<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Mountain variant C (2026-11-13): twin needle spires — sheer, tall,
       wind-cut, with a crystal geode at the root. Lit from upper-left.
       Base line y=120, base half-width ≈44 (Mountain.gd BASE_HALF_SVG). -->
  <defs>
    <linearGradient id="litC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ea4b8"/>
      <stop offset="1" stop-color="#5f6478"/>
    </linearGradient>
    <linearGradient id="shadeC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f5468"/>
      <stop offset="1" stop-color="#2f3242"/>
    </linearGradient>
    <linearGradient id="farC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a83a2"/>
      <stop offset="1" stop-color="#4f5878"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c88cff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c88cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rear needle (bluer, smaller) -->
  <polygon points="66,120 72,72 78,40 84,22 88,36 92,64 98,94 104,120" fill="url(#farC)"/>
  <polygon points="84,22 87,32 84,30 82,38 80,32" fill="#e3ebf6"/>

  <!-- main needle: lit face -->
  <polygon points="22,120 30,96 36,70 40,44 44,22 48,6 50,22 52,44 50,70 54,96 56,120" fill="url(#litC)"/>
  <!-- main needle: shaded face -->
  <polygon points="48,6 52,18 56,36 60,58 64,82 70,100 76,120 56,120 54,96 50,70 52,44 50,22" fill="url(#shadeC)"/>
  <!-- broad root buttress -->
  <polygon points="20,120 26,106 34,100 44,104 56,98 68,104 78,100 90,108 108,120" fill="#4a4f62"/>
  <polygon points="20,120 26,106 34,100 44,104 46,120" fill="#6a7086"/>

  <!-- wind-cut ledges + cracks -->
  <g fill="none" stroke-linecap="round">
    <path d="M38 52 l6 -1 l6 2" stroke="#4a4f62" stroke-width="1.2"/>
    <path d="M34 74 l8 -2 l8 2" stroke="#4a4f62" stroke-width="1.2"/>
    <path d="M30 92 l10 -2 l10 2" stroke="#4a4f62" stroke-width="1.2"/>
    <path d="M54 50 l6 3" stroke="#23262f" stroke-width="1.2"/>
    <path d="M56 70 l8 3 l4 -1" stroke="#23262f" stroke-width="1.2"/>
    <path d="M60 88 l8 3" stroke="#23262f" stroke-width="1.2"/>
    <path d="M44 30 l2 6 l-2 5" stroke="#5a6074" stroke-width="0.9"/>
    <path d="M80 64 l2 8 l-2 6" stroke="#3a3f52" stroke-width="0.9"/>
  </g>
  <path d="M48 6 L50 22 L52 44 L50 70 L54 96" fill="none" stroke="#c5cbdc" stroke-width="1.1" opacity="0.6"/>

  <!-- snow on ledges and tip -->
  <polygon points="48,6 51,16 49,15 47,22 45,16 44,22 46,12" fill="#ffffff"/>
  <polygon points="38,51 44,50 50,52 46,54 40,54" fill="#eef3fa"/>
  <polygon points="34,73 42,71 50,73 44,75 37,75" fill="#e6edf7"/>
  <polygon points="72,82 78,84 74,86" fill="#c0cbdd" opacity="0.8"/>

  <!-- circling birds -->
  <g fill="none" stroke="#2b2e3a" stroke-width="0.9" stroke-linecap="round">
    <path d="M66 18 q2 -2 4 0 q2 -2 4 0"/>
    <path d="M24 30 q1.6 -1.6 3.2 0 q1.6 -1.6 3.2 0"/>
  </g>

  <!-- amethyst geode at the root -->
  <ellipse cx="64" cy="114" rx="12" ry="8" fill="url(#glowC)"/>
  <path d="M54 120 c0 -8 4 -12 10 -12 c6 0 10 4 10 12 z" fill="#2a2433"/>
  <polygon points="57,120 59,111 61,120" fill="#b07cf0"/>
  <polygon points="60,120 63,107 66,120" fill="#d4a8ff"/>
  <polygon points="63,107 66,120 64.5,120" fill="#8c58d0"/>
  <polygon points="66,120 68,112 71,120" fill="#a070e8"/>
  <path d="M62.4 110 l0.8 -2.4" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>

  <!-- scree + a lone pine -->
  <polygon points="10,120 14,114 20,114 22,120" fill="#6a7086"/>
  <polygon points="96,120 100,115 106,115 109,120" fill="#3c4152"/>
  <circle cx="30" cy="118" r="1.4" fill="#7a8098"/>
  <circle cx="88" cy="118" r="1.3" fill="#3c4152"/>
  <rect x="113.2" y="111" width="1.6" height="7" fill="#3a2a1e"/>
  <polygon points="114,98 118.5,106 116,106 119,113 109,113 112,106 109.5,106" fill="#22402e"/>
</svg>
