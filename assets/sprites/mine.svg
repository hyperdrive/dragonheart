<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Dragonheart mine: grassy hill with timber-framed entrance.
       Palette matches mountain.svg / lair.svg / tree.svg (flat polygons;
       rock grays #7a7f8a family, moss greens #3a9a3e family, timber
       #6d4526/#7a5230, warm gold glow #ffb638). -->
  <!-- hill dome -->
  <path d="M2 62 C 2 34, 16 12, 32 12 C 48 12, 62 34, 62 62 Z" fill="#7a8071"/>
  <!-- rocky facets -->
  <path d="M32 16 L 50 62 L 26 62 Z" fill="#8a9082" opacity="0.55"/>
  <path d="M12 40 C 18 30, 22 26, 28 22 L 20 62 L 8 62 Z" fill="#6a705f" opacity="0.5"/>
  <!-- moss ridge -->
  <path d="M2 62 C 2 44, 4 30, 9 22 C 16 40, 12 52, 8 62 Z" fill="#3a9a3e" opacity="0.35"/>
  <circle cx="30" cy="12" r="4" fill="#46b04a"/>
  <circle cx="24" cy="14" r="3" fill="#5ec563" opacity="0.85"/>
  <circle cx="37" cy="14" r="3" fill="#358a39"/>
  <circle cx="18" cy="20" r="2.5" fill="#46b04a" opacity="0.8"/>
  <circle cx="43" cy="22" r="2.5" fill="#3a9a3e" opacity="0.85"/>
  <circle cx="10" cy="34" r="2" fill="#46b04a" opacity="0.6"/>
  <circle cx="55" cy="36" r="2" fill="#3a9a3e" opacity="0.6"/>
  <!-- boulders at the base -->
  <circle cx="7" cy="58" r="5" fill="#5e6470"/>
  <circle cx="3" cy="60" r="3.5" fill="#686d78"/>
  <circle cx="57" cy="58" r="4.5" fill="#5e6470"/>
  <circle cx="61" cy="60" r="3" fill="#686d78"/>
  <!-- timber-framed entrance arch -->
  <path d="M23 62 v-16 a9 9 0 0 1 18 0 v16 z" fill="#171419"/>
  <ellipse cx="32" cy="55" rx="7" ry="5" fill="#ffb638" opacity="0.2"/>
  <rect x="21" y="42" width="4" height="20" fill="#6d4526"/>
  <rect x="39" y="42" width="4" height="20" fill="#6d4526"/>
  <rect x="19" y="40" width="26" height="5" rx="1" fill="#7a5230"/>
  <!-- spoil heap + cart rail from the entrance -->
  <path d="M46 62 L 50 54 L 54 62 Z" fill="#686d78"/>
  <rect x="46" y="60" width="17" height="2.5" fill="#4a3626"/>
  <rect x="48" y="59" width="2.5" height="4" fill="#5a3a20"/>
  <rect x="55" y="59" width="2.5" height="4" fill="#5a3a20"/>
</svg>
