<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Mine (2026-11-14 fantasy pass): rocky outcrop with a mossy crown, a
       braced timber adit, a lantern, ore veins glinting in the rock and a
       rail track running out of the dark. Base line y≈62. The Gold / Gems
       piles are separate nodes in Mine.tscn (shown/hidden by Mine.gd). -->
  <defs>
    <linearGradient id="rockM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a90"/>
      <stop offset="1" stop-color="#55574f"/>
    </linearGradient>
    <radialGradient id="lampM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="adit" cx="0.5" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb04a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outcrop -->
  <path d="M2 62 C 2 46, 6 34, 14 26 C 20 16, 28 12, 36 13 C 46 14, 54 22, 58 34 C 62 44, 62 54, 62 62 Z" fill="url(#rockM)"/>
  <path d="M36 13 C 46 14, 54 22, 58 34 C 62 44, 62 54, 62 62 L 44 62 C 48 44, 44 26, 36 13 Z" fill="#4a4c46" opacity="0.55"/>
  <!-- facets / cracks -->
  <g fill="none" stroke="#3e403a" stroke-width="0.8" stroke-linecap="round">
    <path d="M10 40 l6 -3 l4 2"/><path d="M48 30 l4 4 l4 0"/><path d="M52 46 l5 2"/><path d="M8 52 l5 -2"/>
  </g>
  <!-- mossy crown -->
  <path d="M14 26 C 20 16, 28 12, 36 13 C 46 14, 52 20, 54 26 C 46 22, 40 24, 34 21 C 28 24, 20 22, 14 26 Z" fill="#4f8a46"/>
  <g fill="#62a256"><circle cx="24" cy="18" r="2.2"/><circle cx="36" cy="15" r="2.4"/><circle cx="46" cy="19" r="2"/></g>
  <circle cx="30" cy="17" r="0.9" fill="#f6e36a"/><circle cx="42" cy="17" r="0.8" fill="#ffffff"/>
  <!-- ore veins -->
  <path d="M8 46 l4 -2 l3 1" fill="none" stroke="#e8b93a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M50 40 l3 2 l3 -1" fill="none" stroke="#e8b93a" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="52,52 54,48 56,52 54,54" fill="#5fd6ff"/>
  <polygon points="12,34 14,31 16,34 14,36" fill="#5fd6ff"/>
  <!-- adit: darkness, a warm glimmer, timber bracing -->
  <path d="M22 62 V 42 C 22 38, 26 35, 32 35 C 38 35, 42 38, 42 42 V 62 Z" fill="#141216"/>
  <path d="M22 62 V 42 C 22 38, 26 35, 32 35 C 38 35, 42 38, 42 42 V 62 Z" fill="url(#adit)"/>
  <rect x="20" y="38" width="3.6" height="24" fill="#7a5230"/>
  <rect x="40.4" y="38" width="3.6" height="24" fill="#6d4526"/>
  <rect x="18" y="35" width="28" height="4.4" rx="0.8" fill="#8a5e36"/>
  <path d="M20 37 h26" stroke="#5a3a20" stroke-width="0.6"/>
  <path d="M21 44 l2 -4 M43 44 l-2 -4" stroke="#5a3a20" stroke-width="1.2"/>
  <!-- lantern on the post -->
  <circle cx="17" cy="44" r="5" fill="url(#lampM)"/>
  <path d="M20 41 h-3" stroke="#3a2a1e" stroke-width="0.8"/>
  <rect x="15.4" y="42" width="3.2" height="4" rx="0.6" fill="#ffd56a"/>
  <path d="M15.4 42 h3.2 M15.4 46 h3.2" stroke="#3a2a1e" stroke-width="0.8"/>
  <!-- rails out of the adit -->
  <path d="M26 62 L 28 50 M38 62 L 36 50" stroke="#5a5a62" stroke-width="1"/>
  <g stroke="#5a3a20" stroke-width="1.2"><path d="M26.6 59 h10.8 M27.2 55 h9.6 M27.8 51.6 h8.4"/></g>
  <!-- pickaxe leaning on the right post -->
  <path d="M47 61 l3 -14" stroke="#7a5230" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M46 47 q4 -3 8 1" fill="none" stroke="#9aa0aa" stroke-width="1.4" stroke-linecap="round"/>
</svg>
