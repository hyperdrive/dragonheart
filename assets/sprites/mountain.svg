<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fantasy crag (2026-11-13): lit from the upper-left; distant blue
       ridge behind, jagged main peak with strata, wind-carved snow,
       pines and a glowing crystal vein at the foot. Base line y=120. -->
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7afc0"/>
      <stop offset="1" stop-color="#6e7588"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6378"/>
      <stop offset="1" stop-color="#3b3f50"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d88a8"/>
      <stop offset="1" stop-color="#596384"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ff0ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8ff0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- distant ridge -->
  <polygon points="66,120 78,58 88,34 96,44 104,36 112,56 120,74 128,120" fill="url(#far)"/>
  <polygon points="88,34 92,44 88,42 85,50 82,46" fill="#e4ecf7" opacity="0.85"/>
  <polygon points="104,36 108,46 104,44 101,50 98,44" fill="#e4ecf7" opacity="0.85"/>

  <!-- main peak: lit face -->
  <polygon points="58,5 52,18 46,26 40,40 32,52 26,66 18,80 10,98 3,120 62,120 60,100 64,82 60,64 64,44 61,26" fill="url(#lit)"/>
  <!-- main peak: shadow face -->
  <polygon points="58,5 61,26 64,44 60,64 64,82 60,100 62,120 122,120 112,102 100,86 92,74 84,58 76,42 68,22" fill="url(#shade)"/>

  <!-- strata and cracks -->
  <g fill="none" stroke-linecap="round">
    <path d="M30 62 l10 -3 l9 2 l8 -3" stroke="#5f6577" stroke-width="1.2"/>
    <path d="M20 84 l12 -4 l10 3 l12 -5" stroke="#5f6577" stroke-width="1.2"/>
    <path d="M12 104 l14 -4 l12 3 l14 -4" stroke="#5f6577" stroke-width="1.2"/>
    <path d="M68 60 l8 4 l10 -2 l8 5" stroke="#2f3241" stroke-width="1.2"/>
    <path d="M66 86 l12 4 l10 -3 l12 5" stroke="#2f3241" stroke-width="1.2"/>
    <path d="M44 44 l3 8 l-2 6" stroke="#596075" stroke-width="1"/>
    <path d="M36 92 l4 7 l-3 6" stroke="#596075" stroke-width="1"/>
    <path d="M80 70 l-2 9 l4 6" stroke="#2b2e3c" stroke-width="1"/>
    <path d="M96 96 l-3 8 l3 7" stroke="#2b2e3c" stroke-width="1"/>
  </g>
  <!-- rim light on the ridge line -->
  <path d="M58 5 L61 26 L64 44 L60 64 L64 82" fill="none" stroke="#c9d1e0" stroke-width="1.2" opacity="0.7"/>

  <!-- snow cap: wind-carved, dripping down the gullies -->
  <polygon points="58,5 52,18 47,25 50,28 49,36 54,30 56,40 59,32 61,38 63,30 67,36 69,28 74,34 72,26 68,22" fill="url(#snow)"/>
  <polygon points="61,26 63,30 61,38 59,32" fill="#c9d6e8"/>
  <polygon points="67,36 69,28 74,34 72,26 68,22 70,30" fill="#b9c8dd"/>
  <polygon points="40,44 44,40 46,46 43,50" fill="#eef3fa" opacity="0.9"/>
  <polygon points="80,52 84,56 82,62 78,58" fill="#c3d0e3" opacity="0.8"/>

  <!-- scree / boulders along the base -->
  <g>
    <polygon points="6,120 10,113 17,112 21,120" fill="#7a8194"/>
    <polygon points="10,113 17,112 15,116" fill="#9aa2b4"/>
    <polygon points="44,120 48,114 55,113 58,120" fill="#6a7184"/>
    <polygon points="98,120 102,112 110,111 114,120" fill="#3f4354"/>
    <polygon points="112,120 116,115 122,116 124,120" fill="#474b5d"/>
    <circle cx="30" cy="118" r="1.6" fill="#8a91a3"/>
    <circle cx="36" cy="119" r="1.1" fill="#8a91a3"/>
    <circle cx="88" cy="118" r="1.4" fill="#454a5b"/>
  </g>

  <!-- crystal vein (glowing, miners' prize) -->
  <ellipse cx="80" cy="113" rx="14" ry="9" fill="url(#glow)"/>
  <polygon points="74,120 75,108 78,104 80,110 80,120" fill="#4fb8e0"/>
  <polygon points="78,104 80,110 80,120 77,120" fill="#2c86b8"/>
  <polygon points="80,120 82,102 85,97 87,104 86,120" fill="#7fe0ff"/>
  <polygon points="85,97 87,104 86,120 84,120" fill="#3a9fd0"/>
  <polygon points="86,120 89,111 91,109 92,120" fill="#5ccaf0"/>
  <path d="M83 104 l1 -4" stroke="#e8fbff" stroke-width="1" stroke-linecap="round"/>

  <!-- pines at the foot -->
  <g>
    <rect x="23" y="111" width="2" height="7" fill="#4a3424"/>
    <polygon points="24,96 30,108 27,108 31,114 17,114 21,108 18,108" fill="#2f5a3a"/>
    <polygon points="24,96 27,102 24,102" fill="#447a4e"/>
    <rect x="33" y="114" width="1.6" height="5" fill="#4a3424"/>
    <polygon points="34,103 38.5,111 36,111 39,116 29,116 32,111 29.5,111" fill="#28503a"/>
    <rect x="105" y="112" width="1.6" height="6" fill="#3a2a1e"/>
    <polygon points="106,100 110.5,108 108,108 111,114 101,114 104,108 101.5,108" fill="#22402e"/>
  </g>
</svg>
