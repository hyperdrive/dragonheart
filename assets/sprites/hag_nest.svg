<svg xmlns="http://www.w3.org/2000/svg" width="176" height="150" viewBox="0 0 176 150">
  <!-- The Hag's Nest (2026-11-14): Mother Grisla's crooked swamp cottage on
       stilts over a stinking pool — sagging moss roof, crooked chimney
       coughing green smoke, sickly green-lit window, skull poles, a
       bubbling cauldron. Base y=144; base spans x 14..162. -->
  <defs>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2a4a32"/><stop offset="1" stop-color="#16261a"/></radialGradient>
    <radialGradient id="win" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#b8ff7a" stop-opacity="0.9"/><stop offset="1" stop-color="#6aff3a" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a2a"/><stop offset="1" stop-color="#2a2018"/></linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a7a3a"/><stop offset="1" stop-color="#2a3e1e"/></linearGradient>
  </defs>
  <!-- fen pool + reeds -->
  <ellipse cx="88" cy="138" rx="78" ry="12" fill="url(#pool)"/>
  <ellipse cx="88" cy="136" rx="60" ry="6" fill="#3a6a42" opacity="0.4"/>
  <g stroke="#2a3a1e" stroke-width="1.4" stroke-linecap="round">
    <path d="M 16 140 l -2 -12 M 20 140 l 2 -14 M 158 140 l 2 -12 M 162 140 l -2 -10"/>
  </g>
  <!-- stilts -->
  <g fill="#2a2018">
    <rect x="44" y="104" width="5" height="36" transform="rotate(-4 46 122)"/>
    <rect x="80" y="104" width="5" height="38"/>
    <rect x="118" y="104" width="5" height="36" transform="rotate(5 120 122)"/>
  </g>
  <!-- the cottage: crooked walls -->
  <path d="M 38 106 L 42 62 L 126 58 L 132 104 Z" fill="url(#wood)"/>
  <g stroke="#1a140e" stroke-width="0.8"><path d="M 40 72 L 128 68 M 40 84 L 130 80 M 39 96 L 131 92"/></g>
  <!-- door + green window -->
  <path d="M 96 104 v -24 q 8 -6 14 0 v 24 z" fill="#140e0a"/>
  <circle cx="64" cy="82" r="18" fill="url(#win)"/>
  <path d="M 56 90 v -14 q 8 -6 16 0 v 14 z" fill="#b8ff7a"/>
  <path d="M 64 74 v 16 M 56 83 h 16" stroke="#1a140e" stroke-width="1.2"/>
  <!-- sagging mossy roof + crooked chimney -->
  <path d="M 28 66 Q 60 22 84 18 Q 110 26 140 62 Q 120 58 100 60 Q 70 56 28 66 Z" fill="url(#moss)"/>
  <g fill="#6a8a46" opacity="0.8"><circle cx="50" cy="56" r="3"/><circle cx="74" cy="34" r="2.4"/><circle cx="112" cy="44" r="2.6"/></g>
  <path d="M 104 34 l 3 -18 h 9 l -2 20" fill="#2a2018"/>
  <g fill="#6aaa4a"><circle cx="112" cy="12" r="4" opacity="0.5"/><circle cx="118" cy="6" r="3.4" opacity="0.35"/><circle cx="124" cy="2" r="2.6" opacity="0.2"/></g>
  <!-- walkway planks to the bank -->
  <path d="M 106 104 L 150 132 L 156 128 L 112 102 Z" fill="#3a2a1e"/>
  <!-- skull poles -->
  <g>
    <path d="M 18 142 v -30 M 160 142 v -28" stroke="#2a2018" stroke-width="2"/>
    <circle cx="18" cy="110" r="5" fill="#d8d0b8"/><circle cx="160" cy="112" r="5" fill="#d8d0b8"/>
    <circle cx="16.4" cy="109.4" r="1.2" fill="#0a0a0a"/><circle cx="19.6" cy="109.4" r="1.2" fill="#0a0a0a"/>
    <circle cx="158.4" cy="111.4" r="1.2" fill="#0a0a0a"/><circle cx="161.6" cy="111.4" r="1.2" fill="#0a0a0a"/>
  </g>
  <!-- bubbling cauldron on the bank -->
  <circle cx="146" cy="136" r="10" fill="url(#win)"/>
  <path d="M 136 130 h 20 q 0 12 -10 12 q -10 0 -10 -12 z" fill="#14141a"/>
  <ellipse cx="146" cy="130" rx="10" ry="2.4" fill="#8aff4a"/>
  <g fill="#b8ff7a"><circle cx="142" cy="126" r="1.4"/><circle cx="149" cy="124" r="1.1"/></g>
  <path d="M 140 142 l 4 -4 l 4 4 M 146 142 l 4 -4 l 4 4" stroke="#ff8a2a" stroke-width="1.4" fill="none"/>
  <!-- hanging bones / dried herbs from the eaves -->
  <g stroke="#d8d0b8" stroke-width="1"><path d="M 46 64 v 8 M 54 62 v 6 M 118 60 v 8"/></g>
</svg>
