<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- ground -->
  <rect x="8" y="72" width="80" height="14" rx="4" fill="#3A3327"/>
  <!-- fallen dragon body: limp, wing folded like a torn umbrella -->
  <path d="M18 68 q2 -16 14 -22 q18 -10 40 -6 q10 2 12 10 q2 8 -8 14 q-18 10 -40 8 q-12 -1 -18 -4 z" fill="#5A1F1F"/>
  <path d="M24 66 q4 -12 14 -16 q14 -6 30 -3 q6 1 7 6 q0 5 -7 9 q-16 8 -32 6 q-8 -1 -12 -2 z" fill="#7A2E2A"/>
  <!-- the folded wing -->
  <path d="M52 46 q22 -8 34 2 q-12 3 -16 10 q-8 -6 -18 -12 z" fill="#3F1717"/>
  <path d="M56 48 q16 -5 26 3 q-10 2 -13 7 q-6 -4 -13 -10 z" fill="#5A1F1F" opacity="0.7"/>
  <!-- chest rises once, faintly -->
  <path d="M30 62 q6 -4 10 0 q-5 3 -10 0 z" fill="#B0574E" opacity="0.8"/>
  <!-- horned head at rest -->
  <path d="M70 58 q10 -2 13 4 q-4 5 -12 3 q-4 -2 -1 -7 z" fill="#4A1B1B"/>
  <path d="M80 55 l4 -6 l1 7 z" fill="#D9C08A"/>
  <path d="M73 54 l3 -6 l2 7 z" fill="#D9C08A"/>
  <circle cx="77" cy="60" r="1.4" fill="#E8D48A"/>
  <!-- smoke curl out of the nostrils -->
  <path d="M84 60 q6 -2 8 2 q-5 0 -8 -2 z" fill="#9A948A" opacity="0.7"/>
  <circle cx="90" cy="58" r="2.5" fill="#8A8378" opacity="0.5"/>
  <!-- the victor's shadow looms (killers are told in the text) -->
  <ellipse cx="46" cy="82" rx="30" ry="4" fill="#000000" opacity="0.3"/>
</svg>
